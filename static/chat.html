<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="manifest" href="/static/manifest.json">
        <meta name="theme-color" content="#ffffff">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">

        <meta charset="UTF-8">
        <link rel="stylesheet" href="/static/css/general.css">
        <link rel="stylesheet" href="/static/css/chat.css">
    </head>

    <body>
        <div class="header">
            <a class="back-button animated" href="/">
                <img class="back-button-icon" src="/static/images/icons/arrow-back.svg">
            </a>
            <img class="chat-picture" src="/static/images/icons/group.svg">
            <div class="header-text">
                <p class="chat-name">{% chat.name %}</p>
                <p class="last-online">sågs senast idag 14:25</p>
            </div>
        </div>

        <div class="chat-container">
            <div class="message-container" id="messages">
                
            </div>

            <form class="send-message" action="/chat/{{chat.id}}" method="POST">
                <input type="text" placeholder="Message {{chat.name}}" name="message">
                <button class="animated">
                    <img src="/static/images/icons/arrow-up.svg">
                </button>
            </form>
        </div>

        <script>
            const messageContainer = document.getElementById("messages");

            function scrollToBottom() {
                messageContainer.scrollTop = messageContainer.scrollHeight;
            }

            async function updateMessages() {
                if (document.hidden) return;

                const atBottom =
                    messageContainer.scrollHeight -
                    messageContainer.scrollTop -
                    messageContainer.clientHeight < 100;

                try {
                    const response = await fetch(
                        "/chat/{{chat.id}}/messages"
                    );

                    if (!response.ok) return;

                    const html = await response.text();

                    if (messageContainer.innerHTML !== html) {
                        messageContainer.innerHTML = html;

                        if (atBottom) {
                            scrollToBottom();
                        }
                    }

                } catch (error) {
                    console.log("Message update failed:", error);
                }
            }

            updateMessages();
            scrollToBottom();
            setInterval(updateMessages, 3000);
        </script>
    </body>
</html>
