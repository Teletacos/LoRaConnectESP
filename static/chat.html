<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="manifest" href="/static/manifest.json">
        <meta name="theme-color" content="#ffffff">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">

        <meta charset="UTF-8">
        <link rel="stylesheet" href="/static/css/general.css">
        <link rel="stylesheet" href="/static/css/chat.css">
    </head>
    <body>
        <div class="header">
            <a class="back-button animated" href="/">
                <img class="back-button-icon" src="/static/images/icons/arrow-back.svg">
            </a>
            <img class="chat-picture" src="/static/images/icons/group.svg">
            <div class="header-text">
                <p class="chat-name">{% chat.name %}</p>
                <p class="last-online">sågs senast idag 14:25</p>
            </div>
        </div>

        <div class="chat-container">
            <div class="message-container">
                {{ for message in chat.messages }}
                    {{ if message._is_sender }}
                        <p class="message receiver-message">
                            <img src="/static/images/user-pics/{% message._picture_name %}" class="message-icon">
                            {% message.content %}
                            {% message.status %}
                        </p>
                    {{ else }}
                        <p class="message sender-message">
                            <img src="/static/images/user-pics/{% message._picture_name %}" class="message-icon">
                            {% message.content %}
                            {% message.status %}
                        </p>
                    {{ endif }}
                {{ endfor }}
            </div>

            <form class="send-message" action="/chat/{{chat.id}}" method="POST">
                <input type="text" placeholder="Message {{chat.name}}" name="message">
                <button class="animated">
                    <img src="/static/images/icons/arrow-up.svg">
                </button>
            </form>
        </div>
    </body>

    <script>
        const messageContainer = document.querySelector(".message-container");

        function scrollToBottom() {
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        window.addEventListener("load", scrollToBottom);
    </script>
</html>
