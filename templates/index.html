{% args chats_preview %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#ffffff">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">

        <meta charset="UTF-8">
        <link rel="stylesheet" href="static/css/general.css">
        <link rel="stylesheet" href="static/css/index.css">
    </head>
    <body>
        <div class="header">
            <p class="header-text">Chats</p>
            <form action="/chat/new" method="POST">
                <button class="header-add-button" type="submit">
                    <img class="header-add-icon" src="static/images/icons/add.svg">
                </button>
            </form>
        </div>
        <form class="search-container" action="/" method="POST">
            <button class="search-button" type="submit"><img class="search-button-icon" src="static/images/icons/search.svg"></button>
            <input class="search-box" type="search" name="search" placeholder="{{current_search}}">
        </form>
        <ul class="chat-list">
            {% for chat_id, preview in chats_preview.items() %}
                <li class="chat">
                    <a class="chat-link" href="/chat/{{chat_id}}">
                        <img class="chat-picture" src="{{preview.picture}}">
                        <div class="chat-content">
                            <div class="chat-top">
                                <p class="chat-name">{{ preview.name }}</p>
                                <p class="chat-date">{{ preview.last_date }}</p>
                            </div>
                            <div class="chat-bottom">
                                <p class="chat-msg">{{ preview.last_msg }}</p>
                                <p class="chat-notification">{{ preview.notifications }}</p>
                            </div>
                        </div>
                    </a>
                </li>

            {% endfor %}
        </ul>
    </body>
</html>

<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register(
            "{{ url_for('static', filename='service-worker.js') }}"
        );
    }
</script>
