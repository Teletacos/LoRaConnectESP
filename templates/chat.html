<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="/static/css/general.css">
        <link rel="stylesheet" href="/static/css/chat.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="header">
            <a class="back-button" href="/">
                <img class="back-button-icon" src="/static/images/icons/arrow-back.svg">
            </a>
            <img class="chat-picture" src="/static/{{chat.picture_path}}">
            <div class="header-text">
                <p class="chat-name">{{chat.name}}</p>
                <p class="last-online">sågs senast idag 14:25</p>
            </div>
        </div>

        <div class="chat-container">
            <div class="message-container">
                {% for message in chat.messages %}
                    {% if message.sender == user_data.id %}
                        <p class="message receiver-message">
                            <img src="/static/{{user_data.picture}}" 
                                alt="Sender Icon"
                                class="message-icon">
                                {{message.content}}
                        </p>
                    {% else %}
                        <p class="message sender-message">
                            <img src="/static/{{chat.picture}}"
                                alt="Receiver Icon" 
                                class="message-icon">
                                {{message.content}}
                        </p>
                    {% endif %}
                {% endfor %}
            </div>

            <form class="send-message" action="/chat/{{chat_id}}" method="POST">
                <input type="text" placeholder="Message {{chat.name}}" name="message">
                <button>
                    <img src="/static/images/icons/arrow-up.svg">
                </button>
            </form>
        </div>
    </body>
</html>
